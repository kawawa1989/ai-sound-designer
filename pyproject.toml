[project]
name = "synth-ai"
version = "0.1.0"
description = "参照WAVの解析からシンセの音作りレシピを提案し、実機録音と比較して改善する"
readme = "README.md"
authors = [
    { name = "chibiman10", email = "chibimanju.stream@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "mido>=1.3.3",
    "numpy>=2.5.4",
    "pydantic>=2",
    "python-rtmidi>=1.5.8",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "typer>=0.27.3",
]

[project.scripts]
synth-ai = "synth_ai.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown（plan/ のロードマップ等）は整形対象にしない
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["librosa.*", "soundfile.*", "sounddevice.*", "mido.*", "rtmidi.*"]
ignore_missing_imports = true
